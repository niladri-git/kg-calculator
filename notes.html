<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            font-size: 1.1em;
        }
        pre {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
            border-radius: 8px;
            overflow-x: auto;
        }
        .note-paragraph {
            cursor: pointer;
            margin-bottom: 10px; /* Add some spacing between paragraphs */
            padding: 5px;
            border-radius: 4px;
        }
        .note-paragraph:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    <div class="controls">
        <button id="read-aloud-btn">Read All Notes</button>
        <button id="stop-read-aloud-btn">Stop Reading</button>
        <label for="voice-select">Voice:</label>
        <select id="voice-select"></select>
    </div>

    <div id="notes-container"></div>

    <script>
        const notesContainer = document.getElementById('notes-container');
        const readAloudBtn = document.getElementById('read-aloud-btn');
        const stopReadingBtn = document.getElementById('stop-read-aloud-btn');
        const voiceSelect = document.getElementById('voice-select');
        let currentUtterance = null;
        let voices = [];

        function populateVoiceList() {
            voices = speechSynthesis.getVoices().sort((a, b) => a.name.localeCompare(b.name));
            voiceSelect.innerHTML = '';
            
            // Mobile compatibility: Include all English voices, not just the hardcoded ones
            // This ensures functionality on Android/iOS which lack the specific Microsoft voices
            voices.forEach((voice, index) => {
                const desiredVoiceNames = [
                    "Microsoft Christopher Online (Natural) - English (United States)",
                    "Microsoft Clara Online (Natural) - English (Canada)"
                ];
                
                // Show if it's a desired voice OR if it's an English voice
                if (desiredVoiceNames.includes(voice.name) || voice.lang.startsWith('en')) {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    if (voice.default) {
                        option.textContent += ' -- DEFAULT';
                    }
                    option.setAttribute('data-lang', voice.lang);
                    option.setAttribute('data-name', voice.name);
                    option.value = index;
                    voiceSelect.appendChild(option);
                }
            });

            // Set Microsoft Christopher Online (Natural) - English (United States) as default preference
            // Use 'includes' for safer matching as names can vary slightly
            const christopherIndex = voices.findIndex(voice => 
                voice.name.includes("Microsoft Christopher Online (Natural)") && voice.lang === "en-US"
            );

            if (christopherIndex !== -1 && Array.from(voiceSelect.options).some(opt => opt.value == christopherIndex)) {
                voiceSelect.value = christopherIndex;
            } else if (voiceSelect.options.length > 0) {
                // Fallback to the first available option in the dropdown
                voiceSelect.selectedIndex = 0;
            }
        }

        // Populate voices initially and when they change
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function speakText(textToSpeak) {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }

            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            
            const selectedVoiceIndex = voiceSelect.value;
            if (selectedVoiceIndex !== null && voices[selectedVoiceIndex]) {
                currentUtterance.voice = voices[selectedVoiceIndex];
            } else {
                // Fallback to default if no voice is selected or found
                currentUtterance.voice = speechSynthesis.getVoices().find(v => v.default) || voices[0];
            }

            currentUtterance.lang = currentUtterance.voice.lang; // Set lang based on selected voice
            currentUtterance.rate = 1; // You can adjust speed
            currentUtterance.pitch = 1; // You can adjust pitch

            currentUtterance.onend = () => {
                currentUtterance = null;
            };

            currentUtterance.onerror = (event) => {
                console.error('SpeechSynthesisUtterance.onerror', event);
            };

            speechSynthesis.speak(currentUtterance);
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetch('notes.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(data => {
                    const paragraphs = data.split(/\r?\n\s*\r?\n/); // Split by one or more blank lines
                    paragraphs.forEach(paragraphText => {
                        if (paragraphText.trim()) { // Only add non-empty paragraphs
                            const p = document.createElement('p');
                            p.classList.add('note-paragraph');
                            p.textContent = paragraphText.trim();
                            notesContainer.appendChild(p);

                            p.addEventListener('click', function() {
                                if ('speechSynthesis' in window) {
                                    speakText(p.textContent);
                                } else {
                                    alert('Sorry, your browser does not support the Web Speech API.');
                                }
                            });
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading notes.txt:', error);
                    notesContainer.innerHTML = `<p style="color: red;">Failed to load notes: ${error.message}</p>`;
                });
        });

        readAloudBtn.addEventListener('click', () => {
            const allParagraphs = Array.from(notesContainer.querySelectorAll('.note-paragraph'));
            const fullText = allParagraphs.map(p => p.textContent).join('\n\n');
            speakText(fullText);
        });

        stopReadingBtn.addEventListener('click', () => {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            currentUtterance = null;
        });
    </script>
</body>
</html>
