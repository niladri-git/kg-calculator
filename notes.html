<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            font-size: 1.1em;
        }
        pre {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    <button id="read-aloud-btn">Read Aloud</button>
    <button id="stop-read-aloud-btn">Stop Reading</button>

    <pre id="notes-content"></pre>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('notes.txt')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('notes-content').textContent = data;
                })
                .catch(error => console.error('Error fetching notes:', error));
        });

        document.getElementById('read-aloud-btn').addEventListener('click', function() {
            const textToRead = document.getElementById('notes-content').textContent;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToRead);
                speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support the Web Speech API.');
            }
        });

        document.getElementById('stop-read-aloud-btn').addEventListener('click', function() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
