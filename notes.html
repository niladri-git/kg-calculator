<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            font-size: 1.1em;
        }
        pre {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
            border-radius: 8px;
            overflow-x: auto;
        }
        .note-paragraph {
            cursor: pointer;
            margin-bottom: 10px; /* Add some spacing between paragraphs */
            padding: 5px;
            border-radius: 4px;
        }
        .note-paragraph:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    <button id="read-aloud-btn">Read Aloud</button>
    <button id="stop-read-aloud-btn">Stop Reading</button>

    <div id="notes-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('notes.txt')
                .then(response => response.text())
                .then(data => {
                    const notesContainer = document.getElementById('notes-container');
                    const paragraphs = data.replace(/\r\n/g, '\n').split(/\n\s*\n/);

                    paragraphs.forEach(paragraphText => {
                        if (paragraphText.trim() !== '') {
                            const p = document.createElement('p');
                            p.classList.add('note-paragraph');
                            p.textContent = paragraphText.trim();
                            notesContainer.appendChild(p);

                            p.addEventListener('click', function() {
                                if ('speechSynthesis' in window) {
                                    speechSynthesis.cancel(); // Stop any ongoing speech
                                    const utterance = new SpeechSynthesisUtterance(p.textContent);
                                    speechSynthesis.speak(utterance);
                                } else {
                                    alert('Sorry, your browser does not support the Web Speech API.');
                                }
                            });
                        }
                    });
                })
                .catch(error => console.error('Error fetching notes:', error));
        });

        document.getElementById('read-aloud-btn').addEventListener('click', function() {
            const allParagraphs = document.querySelectorAll('.note-paragraph');
            let fullTextToRead = '';
            allParagraphs.forEach(p => {
                fullTextToRead += p.textContent + ' ';
            });

            if ('speechSynthesis' in window) {
                speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(fullTextToRead.trim());
                speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support the Web Speech API.');
            }
        });

        document.getElementById('stop-read-aloud-btn').addEventListener('click', function() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
